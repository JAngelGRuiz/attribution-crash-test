services:
  redis:
    image: redis:7-alpine
    ports: ["6390:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trybe
      POSTGRES_PASSWORD: trybe
      POSTGRES_DB: attribution
    ports: ["5440:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trybe -d attribution"]
      interval: 2s
      timeout: 2s
      retries: 15
